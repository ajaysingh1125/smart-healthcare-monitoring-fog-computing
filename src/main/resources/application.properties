# ===================================================================
# SMART HEALTHCARE MONITORING USING FOG COMPUTING - PHASE 1
# Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Identity
spring.application.name=smart-healthcare-fog-node

# MongoDB Connection Properties (Community Server)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=smart_healthcare
spring.data.mongodb.auto-index-creation=true

# Connection Timeout & Lifecycle Configurations
spring.data.mongodb.connection-timeout=5000

# Logging Configurations
logging.level.root=INFO
logging.level.com.healthcare.fog=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
